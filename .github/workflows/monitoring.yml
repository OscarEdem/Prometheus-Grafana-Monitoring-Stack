name: "Monitoring Stack CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Provision Infrastructure & Build/Deploy Custom Docker Images
  terraform:
    name: "Provision Infrastructure & Build/Deploy Containers"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Import Existing GCP Resources
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          terraform import google_compute_instance.monitoring_vm projects/${{ secrets.GCP_PROJECT_ID }}/zones/us-west1-b/instances/monitoring-stack-vm || true
          terraform import google_compute_firewall.allow_grafana projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/allow-grafana-monitoring || true
          terraform import google_compute_firewall.allow_prometheus projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/allow-prometheus-monitoring || true
          terraform import google_compute_firewall.allow_loki_push projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/allow-loki-push-monitoring || true
          terraform import google_compute_firewall.allow_ssh projects/${{ secrets.GCP_PROJECT_ID }}/global/firewalls/allow-ssh-monitoring || true

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Plan
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        run: terraform apply -auto-approve tfplan

      - name: Build Custom Docker Images & Deploy Directly to Live VM
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          gcloud compute ssh monitoring-stack-vm --zone=us-west1-b --command="cd /opt/monitoring && sudo git fetch --all && sudo git reset --hard origin/main && sudo docker compose build && sudo docker compose up -d"

name: "Continuous Deployment to GCP VM"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  deploy:
    name: "Deploy & Update Monitoring Stack on GCP VM"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Setup Cloud SDK
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. SSH into GCP VM and run container deployment
      - name: Deploy Containers on GCP VM via gcloud SSH
        run: |
          gcloud compute ssh monitoring-stack-vm --zone=us-central1-a --project=${{ secrets.GCP_PROJECT_ID }} --command="
            sudo apt-get update -y && \
            sudo apt-get install -y docker.io docker-compose git && \
            sudo systemctl enable --now docker && \
            sudo mkdir -p /opt/monitoring && \
            sudo chown -R \$USER:\$USER /opt/monitoring && \
            cd /opt/monitoring && \
            if [ ! -d .git ]; then git clone https://github.com/OscarEdem/Prometheus-Grafana-Monitoring-Stack.git .; else git pull origin main; fi && \
            sudo docker-compose up -d
          "

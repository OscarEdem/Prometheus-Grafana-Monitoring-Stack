global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ec2-host-metrics'
    static_configs:
      - targets: ['node_exporter:9100', 'host.docker.internal:9100']

  - job_name: 'ec2-container-metrics'
    static_configs:
      - targets: ['cadvisor:8080', 'host.docker.internal:8080']


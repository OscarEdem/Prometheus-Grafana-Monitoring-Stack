global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'host-metrics'
    static_configs:
      - targets: ['node_exporter:9100', 'host.docker.internal:9100', '16.192.111.188:9100']

  - job_name: 'container-metrics'
    static_configs:
      - targets: ['cadvisor:8080', 'host.docker.internal:8080', '16.192.111.188:8080']



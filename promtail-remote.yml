# --------------------------------------------------------------------------------------------------------------------                                                                                                                                                                                #*eddiere
# Promtail Remote Agent — AfroVogue AWS Server
# Ships logs to Loki on the GCP Monitoring VM (8.231.152.191)
# -----------------------------------------------------------

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://8.231.152.191:3100/loki/api/v1/push

scrape_configs:
  # System logs (/var/log)
  - job_name: afrovogue-system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system-logs
          host: afrovogue-aws
          __path__: /var/log/*log

  - job_name: afrovogue-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - replacement: afrovogue-aws
        target_label: host
      - replacement: docker-logs
        target_label: job
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - labels:
          stream:
      - output:
          source: log

  # Nginx access & error logs
  - job_name: afrovogue-nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-logs
          host: afrovogue-aws
          __path__: /var/log/nginx/*.log

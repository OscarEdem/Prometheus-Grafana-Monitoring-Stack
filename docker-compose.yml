services:
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: custom-prometheus:latest
    container_name: local_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 150M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    image: custom-grafana:latest
    container_name: local_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/json/infra-monitor.json
      - GF_SERVER_ROOT_URL=http://${VM_PUBLIC_IP:-localhost}:3001
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 200M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #   node_exporter:
